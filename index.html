<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React</title>
  </head>
  <body>
    <div id="root">
      <h1>Hello World</h1>
    </div>
    <div id="mUJS"></div>
    <script type="module" src="./App.js"></script>
    <script>
      let m = document.getElementById("mUJS");
      let h1 = document.createElement("h1");
      h1.textContent = "Hello World";

      m.appendChild(h1);
    </script>
  </body>
</html>
